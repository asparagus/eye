[project]
name = "eye"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jigsaw-ml",
    "lightning>=2.5.5",
    "matplotlib>=3.10.6",
    "optuna>=4.5.0",
    "optuna-dashboard>=0.19.0",
    "pydantic-settings>=2.10.1",
    "tensorboard>=2.20.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
]

[tool.uv.sources]
jigsaw-ml = { git = "https://github.com/asparagus/jigsaw-ml", rev = "main" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
